[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-system-from-scratch"
version = "0.1.0"
description = "Lean RAG pipeline with selectable chunking strategies"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live: tests that call a real LLM (skipped unless RUN_LIVE=1)",
  "slow: tests that download embedding models",
]